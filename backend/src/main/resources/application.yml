spring:
  application:
    name: mini-maya-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/minimaya
    username: minimaya
    password: minimaya_dev
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          batch_size: 50

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: minimaya

  rabbitmq:
    host: localhost
    port: 5672
    username: minimaya
    password: minimaya_dev
    virtual-host: /

  websocket:
    message-size-limit: 10485760  # 10 MB

server:
  port: 8080
  servlet:
    context-path: /api/v1

minimaya:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-use-256-bit-key}
    access-token-expiry-ms: 900000     # 15 min
    refresh-token-expiry-ms: 604800000 # 7 days
  minio:
    endpoint: http://localhost:9000
    access-key: minimaya
    secret-key: minimaya_dev
    bucket: minimaya-assets
  rabbitmq:
    render-jobs-queue:     render.jobs
    render-results-queue:  render.results
    preview-frames-queue:  render.previews
    render-exchange:       minimaya.render
