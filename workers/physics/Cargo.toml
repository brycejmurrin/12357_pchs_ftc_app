[package]
name    = "minimaya-physics"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen    = "0.2.92"
js-sys          = "0.3.69"
web-sys         = { version = "0.3.69", features = ["console"] }
getrandom       = { version = "0.2", features = ["js"] }

# AABB collision detection
# (will be replaced with rapier3d-f32 once WASM target is validated)
nalgebra        = { version = "0.32", default-features = false, features = ["alloc"] }

[profile.release]
opt-level     = "z"
lto           = true
codegen-units = 1

[dev-dependencies]
wasm-bindgen-test = "0.3"
