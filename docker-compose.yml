version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: minimaya_postgres
    environment:
      POSTGRES_DB: minimaya
      POSTGRES_USER: minimaya
      POSTGRES_PASSWORD: minimaya_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minimaya"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: minimaya_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: minimaya
      RABBITMQ_DEFAULT_PASS: minimaya_dev
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: minimaya_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minimaya
      MINIO_ROOT_PASSWORD: minimaya_dev
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  rabbitmq_data:
  minio_data:
