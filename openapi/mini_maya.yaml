openapi: "3.1.0"
info:
  title: Mini Maya Control Plane API
  version: "0.1.0"
  description: |
    REST/JSON Control Plane for Mini Maya.
    Low-frequency operations only: auth, project management, asset registry,
    and render job lifecycle. High-frequency 3D geometry uses the WebSocket
    Data Plane (binary Protobuf).
servers:
  - url: http://localhost:8080/api/v1
    description: Local development

security:
  - bearerAuth: []

paths:
  # ── Auth ──────────────────────────────────────────────────────────────────
  /auth/register:
    post:
      operationId: registerUser
      summary: Register a new user account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "409":
          $ref: "#/components/responses/Conflict"

  /auth/login:
    post:
      operationId: loginUser
      summary: Authenticate and receive a JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/refresh:
    post:
      operationId: refreshToken
      summary: Refresh an expired JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: New token pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  # ── Projects ─────────────────────────────────────────────────────────────
  /projects:
    get:
      operationId: listProjects
      summary: List all projects for the current user
      responses:
        "200":
          description: Project list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      summary: Create a new project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/projectId"
    get:
      operationId: getProject
      summary: Get project metadata
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteProject
      summary: Delete a project and all its data
      responses:
        "204":
          description: Deleted

  # ── VCS ──────────────────────────────────────────────────────────────────
  /projects/{projectId}/branches:
    parameters:
      - $ref: "#/components/parameters/projectId"
    get:
      operationId: listBranches
      summary: List all branches for a project
      responses:
        "200":
          description: Branch list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Branch"
    post:
      operationId: createBranch
      summary: Create a new branch from a commit SHA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBranchRequest"
      responses:
        "201":
          description: Branch created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Branch"

  /projects/{projectId}/commits:
    parameters:
      - $ref: "#/components/parameters/projectId"
    get:
      operationId: listCommits
      summary: List commits on a branch
      parameters:
        - name: branch
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Commit log
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Commit"

  # ── Assets ───────────────────────────────────────────────────────────────
  /projects/{projectId}/assets/upload-url:
    parameters:
      - $ref: "#/components/parameters/projectId"
    post:
      operationId: getAssetUploadUrl
      summary: Get a presigned MinIO PUT URL for asset upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetUploadRequest"
      responses:
        "200":
          description: Presigned upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetUploadResponse"

  # ── Render Jobs ──────────────────────────────────────────────────────────
  /projects/{projectId}/renders:
    parameters:
      - $ref: "#/components/parameters/projectId"
    post:
      operationId: submitRenderJob
      summary: Submit a new cloud render job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRenderJobRequest"
      responses:
        "202":
          description: Render job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RenderJob"
    get:
      operationId: listRenderJobs
      summary: List render jobs for a project
      responses:
        "200":
          description: Render job list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RenderJob"

  /projects/{projectId}/renders/{jobId}:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - name: jobId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getRenderJob
      summary: Get render job status and result
      responses:
        "200":
          description: Render job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RenderJob"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    projectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Resource already exists
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ErrorResponse:
      type: object
      properties:
        code:    { type: string }
        message: { type: string }
      required: [code, message]

    RegisterRequest:
      type: object
      properties:
        email:    { type: string, format: email }
        password: { type: string, minLength: 8 }
        displayName: { type: string }
      required: [email, password, displayName]

    LoginRequest:
      type: object
      properties:
        email:    { type: string, format: email }
        password: { type: string }
      required: [email, password]

    RefreshRequest:
      type: object
      properties:
        refreshToken: { type: string }
      required: [refreshToken]

    AuthResponse:
      type: object
      properties:
        accessToken:  { type: string }
        refreshToken: { type: string }
        expiresIn:    { type: integer, description: "seconds" }
        user:
          $ref: "#/components/schemas/UserSummary"

    UserSummary:
      type: object
      properties:
        id:          { type: string, format: uuid }
        email:       { type: string, format: email }
        displayName: { type: string }

    Project:
      type: object
      properties:
        id:          { type: string, format: uuid }
        name:        { type: string }
        description: { type: string }
        ownerId:     { type: string, format: uuid }
        createdAt:   { type: string, format: date-time }
        updatedAt:   { type: string, format: date-time }
        defaultBranch: { type: string }

    CreateProjectRequest:
      type: object
      properties:
        name:        { type: string, minLength: 1 }
        description: { type: string }
      required: [name]

    Branch:
      type: object
      properties:
        name:      { type: string }
        headSha:   { type: string }
        isDefault: { type: boolean }
        updatedAt: { type: string, format: date-time }

    CreateBranchRequest:
      type: object
      properties:
        name:     { type: string }
        fromSha:  { type: string }
      required: [name, fromSha]

    Commit:
      type: object
      properties:
        sha:       { type: string }
        message:   { type: string }
        author:    { type: string }
        treeSha:   { type: string }
        parentSha: { type: string }
        timestamp: { type: string, format: date-time }

    AssetUploadRequest:
      type: object
      properties:
        filename:  { type: string }
        mimeType:  { type: string }
        sizeBytes: { type: integer }
      required: [filename, mimeType]

    AssetUploadResponse:
      type: object
      properties:
        uploadUrl: { type: string, format: uri }
        assetKey:  { type: string }
        expiresIn: { type: integer }

    CreateRenderJobRequest:
      type: object
      properties:
        commitSha:     { type: string }
        width:         { type: integer, default: 1920 }
        height:        { type: integer, default: 1080 }
        samples:       { type: integer, default: 128 }
        engine:        { type: string, enum: [CYCLES, EEVEE], default: CYCLES }
        useDenoiser:   { type: boolean, default: true }
        previewSamples: { type: integer, default: 16 }
      required: [commitSha]

    RenderJob:
      type: object
      properties:
        id:             { type: string, format: uuid }
        projectId:      { type: string, format: uuid }
        commitSha:      { type: string }
        status:         { type: string, enum: [QUEUED, RUNNING, PREVIEWING, COMPLETE, FAILED, CANCELLED] }
        createdAt:      { type: string, format: date-time }
        startedAt:      { type: string, format: date-time, nullable: true }
        completedAt:    { type: string, format: date-time, nullable: true }
        resultAssetKey: { type: string, nullable: true }
        errorMessage:   { type: string, nullable: true }
